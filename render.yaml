services:
  # -------------------------------------------------------------
  # CareTrace Core Backend API & Real-time SSE Service
  # -------------------------------------------------------------
  - type: web
    name: caretrace-sandeep-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:backend
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: caretrace-db
          property: connectionString

databases:
  # -------------------------------------------------------------
  # CareTrace Managed PostgreSQL Database (Render Free Tier)
  # NOTE: Render Free databases expire 30 days after creation.
  # -------------------------------------------------------------
  - name: caretrace-db
    databaseName: caretrace
    user: caretrace_user
    plan: free

  # -------------------------------------------------------------
  # CareTrace Web Operations Portal & Public Needs Board
  # -------------------------------------------------------------
  - type: static
    name: caretrace-web
    buildCommand: npm install && npm run build:shared && npm run build:web
    staticPublishPath: packages/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: caretrace-sandeep-backend
          property: host
